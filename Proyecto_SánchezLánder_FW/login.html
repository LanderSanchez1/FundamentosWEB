<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MediCitas Web - Iniciar sesión</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <img src="images/logo.svg" alt="Logo MediCitas" class="logo">
      <h1>MediCitas Web</h1>
    </div>
  </header>

  <main>
    <section class="form-card">
      <h2>Iniciar sesión</h2>
      <form action="index.html" method="get">
        <label for="user">Usuario o correo electrónico</label>
        <input id="user" name="user" type="text" required>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" minlength="8" maxlength="16" required>

        <button type="submit">Ingresar</button>
      </form>

      <p>¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
    </section>
  </main>

  <footer>
    <p> 2026 MediCitas Web</p>
  </footer>
</body>
</html>
