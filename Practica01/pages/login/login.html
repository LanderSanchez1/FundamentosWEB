<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Lánder Sánchez</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eef6ff;
            color: #1b2a4a;
            line-height: 1.6;
        }

        header,
        nav,
        main,
        footer {
            max-width: 980px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        header {
            background-color: #dbe9ff;
            border-bottom: 4px solid #7aa9ff;
            padding: 1.5rem 0;
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
            color: #154478;
        }

        nav {
            margin: 1rem 0;
            background-color: #dbe9ff;
            padding: 0.75rem 1rem;
            border-radius: 8px;
        }

        nav a {
            color: #1c3f72;
            text-decoration: none;
            margin-right: 1rem;
            font-weight: 600;
        }

        nav a:hover {
            text-decoration: underline;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            padding: 1rem 0 2rem;
        }

        .form-card {
            background-color: #ffffff;
            border: 1px solid #d3dce6;
            border-radius: 10px;
            padding: 1.8rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .form-card h2 {
            margin-top: 0;
            font-size: 1.6rem;
            color: #1a3766;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1rem;
        }

        .form-row label {
            flex: 1 1 160px;
            min-width: 130px;
            font-weight: 600;
        }

        .form-row input {
            flex: 2 1 260px;
            padding: 0.75rem 0.9rem;
            border: 1px solid #aac4e6;
            border-radius: 8px;
            background-color: #f7faff;
            color: #1b2a4a;
        }

        button {
            background-color: #2c5aa0;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 0.9rem 1.4rem;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background-color: #1f4472;
        }

        footer {
            border-top: 1px solid #d3dce6;
            padding: 1rem 0 2rem;
            color: #4b5e7a;
            text-align: center;
        }

        @media (max-width: 700px) {
            .form-row {
                flex-direction: column;
                align-items: stretch;
            }

            nav a {
                display: block;
                margin: 0.35rem 0;
            }
        }
    </style>
</head>
<body>
    <!-- Encabezado de la página de login -->
    <header>
        <h1>Login simulado</h1>
    </header>
    <!-- Navegación secundaria hacia otras páginas -->
    <nav>
        <a href="../../index.html">Inicio</a>
        <a href="../horario/horario.html">Horario</a>
        <a href="../multimedia/multimedia.html">Multimedia</a>
        <a href="../contacto/contacto.html">Contacto</a>
        <a href="../buscar/buscar.html">Buscar</a>
        <a href="../formularios/formularios.html">Formularios</a>
        <a href="login.html">Login</a>
    </nav>
    <main>
        <!-- Sección principal del formulario de inicio de sesión -->
        <section class="form-card">
            <h2>Iniciar sesión</h2>
            <p>Ingresa tu correo electrónico y contraseña para acceder.</p>
            <form method="POST">
                <fieldset>
                    <legend>Cuenta</legend>
                    <div class="form-row">
                        <label for="email-login">Correo electrónico</label>
                        <input type="email" id="email-login" name="email" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="form-row">
                        <label for="password-login">Contraseña</label>
                        <input type="password"
                               id="password-login"
                               name="password"
                               placeholder="8 a 16 caracteres"
                               required
                               minlength="8"
                               maxlength="16"
                               pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,16}"
                               title="8 a 16 caracteres, con letras, números y al menos un carácter especial."
                        >
                    </div>
                </fieldset>
                <button type="submit">Acceder</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Creado por Lánder Sánchez.</p>
        <p>Clase de Fundamentos Web - HTML Semántico</p>
    </footer>
</body>
</html>
