<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCitas Web - Registro</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header>
        <h1>MediCitas Web</h1>
        <p>Registro de nuevo usuario</p>
    </header>
    <main>
        <section class="form-card">
            <h2>Crear cuenta</h2>
            <form action="login.html" method="get">
                <label for="nombres">Nombres</label>
                <input type="text" id="nombres" name="nombres" required>

                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" name="apellidos" required>

                <label for="cedula">Cédula</label>
                <input type="text" id="cedula" name="cedula" maxlength="10" required>

                <label for="nacimiento">Fecha de nacimiento</label>
                <input type="date" id="nacimiento" name="nacimiento" required>

                <label for="genero">Género</label>
                <select id="genero" name="genero" required>
                    <option value="">Selecciona...</option>
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                </select>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" minlength="8" maxlength="16" required>

                <button type="submit">Registrar</button>
            </form>
            <p>Ya tienes cuenta? <a href="login.html">Volver al login</a></p>
        </section>
    </main>
    <footer>
        <p>MediCitas Web - Lander Sánchez</p>
    </footer>
</body>
</html>
