<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCitas Web - Contacto</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header>
        <h1>MediCitas Web</h1>
        <p>Contacto</p>
    </header>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="acerca.html">Acerca de</a>
        <a href="principal.html#servicios">Servicios</a>
        <a href="contacto.html">Contacto</a>
        <a href="login.html">Cerrar sesión</a>
    </nav>
    <main>
        <section class="contact-card">
            <h2>Escríbenos</h2>
            <p>Ponte en contacto con nosotros para consultas, sugerencias o información sobre MediCitas Web</p>
            <form>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="email-contacto">Correo electrónico</label>
                <input type="email" id="email-contacto" name="email-contacto" required>

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="4" required></textarea>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
    <footer>
        <p>MediCitas Web - Lander Sánchez</p>
    </footer>
</body>
</html>
